# ==============================================================
# FOGLEAGUE — FLY.IO CONFIGURATION (MICRO VM SERVEUR PARIS)
# ==============================================================

app = "fogleague"
primary_region = "cdg" # Paris (Europe - 9ms ping)

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
